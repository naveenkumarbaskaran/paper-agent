[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-agent-ai"
version = "0.1.0"
description = "AI-powered academic paper analysis — summarise, extract methods, compare findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["anthropic", "claude", "papers", "research", "nlp", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.30.0",
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27.0",
    "pypdf>=4.0",
]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/your-org/paper-agent-ai"
Issues = "https://github.com/your-org/paper-agent-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["paper_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
